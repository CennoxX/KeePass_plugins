name: Update plugins.json

on:
  schedule:
    - cron: "10 10 * * 2"
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: clone repo
        uses: actions/checkout@v6
        
      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: run deno script
        run: deno run --allow-net=keepass.info,api.github.com,raw.githubusercontent.com,sourceforge.net --allow-write --allow-env loadPlugins.js
        env:
          GITHUB_PAT: ${{secrets.PAT}}

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git diff --cached --quiet || git commit -m "Update plugins [skip ci]"
          git push
