name: Update plugins.json

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: clone repo
        uses: actions/checkout@v4
        
      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: run deno script
        run: deno run --allow-net=keepass.info --allow-write loadPlugins.js

      - name: commit and push
        run: |
          git config --global user.email "cesar.bernard@gmx.de"
          git config --global user.name "CennoxX"
          git config --global credential.helper cache
          git clone https://${{secrets.PAT}}@github.com/CennoxX/plugin_tests
          cp plugins.json  plugin_tests/plugins.json
          cd plugin_tests
          git add plugins.json
          git commit -m "Update plugins.json [skip ci]" || echo "Keine Änderungen"
          git push
