name: Update plugins.json

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: clone repo
        uses: actions/checkout@v4
        
      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: run deno script
        run: deno run -A loadPlugins.js

      - name: commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          echo testing...
          echo ${{secrets.ACCESS_TOKEN}}
          echo $ACCESS_TOKEN
          git config --global user.email "cesar.bernard@gmx.de"
          git config --global user.name "CennoxX"
          git config --global credential.helper cache
          git clone https://${{secrets.ACCESS_TOKEN}}@github.com/CennoxX/plugin_tests
          cp plugins.json  plugin_tests/plugins.json
          cd plugin_tests
          git add plugins.json
          git commit -m "$(date)"
          git push
