name: Update plugins.json

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  commit:

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: clone repo
        uses: actions/checkout@v4
        
      - name: install deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: run deno script
        run: deno run -A loadPlugins.js

      - name: commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo $GITHUB_TOKEN
          git config --global user.name 'CennoxX'
          git config --global user.email 'cennoxx@users.noreply.github.com'
          git commit -m "plugins.json updated" || echo "no changes"
          git remote set-url --push origin https://cennoxx:$GITHUB_TOKEN@github.com/cennoxx/plugin_test
          git push
